# /etc/nginx/sites-available/our-server-site
# Site: mc.vin-off.site -> Node.js on 127.0.0.1:3000
# Map:  map.vin-off.site -> squaremap internal web server on 127.0.0.1:8080
# certbot --nginx adds the HTTPS parts (listen 443, certificates, redirect from http).

gzip on;
gzip_comp_level 5;
gzip_min_length 512;
gzip_vary on;
gzip_proxied any;
gzip_types text/css text/plain application/javascript text/javascript application/json image/svg+xml application/xml;

limit_req_zone $binary_remote_addr zone=site_api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name mc.vin-off.site;

    client_max_body_size 1m;
    server_tokens off;

    location /api/ {
        limit_req zone=site_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/our-server-site-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/our-server-site-proxy.conf;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name map.vin-off.site;

    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/our-server-site-proxy.conf;

        # the map may only be embedded by the site itself
        add_header Content-Security-Policy "frame-ancestors https://mc.vin-off.site" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
